[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.4.0"
description = "Fast index and ranked search CLI tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.28.1",
    "selectolax>=1.0.2",
    "yarl>=1.25.1",
    "psutil>=7.2.2",
    "pytest-asyncio>=1.4.1",
]

[project.scripts]
findex = "findex.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0.0",
    "pyright>=1.1.0",
    "ruff>=0.1.0",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
